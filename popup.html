<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일본어 띄어쓰기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1 class="popup__title">일본어 띄어쓰기</h1>
    <p class="popup__desc">Sudachi 文節(Mode B) 분석으로 현재 탭의 일본어 텍스트에 공백을 추가합니다. 첫 적용 시 사전 로드로 시간이 걸릴 수 있습니다.</p>
    <div class="popup__actions">
      <button id="applyBtn" type="button" class="btn btn--primary">띄어쓰기 적용</button>
      <button id="restoreBtn" type="button" class="btn btn--secondary">원문 복원</button>
    </div>
    <p id="status" class="popup__status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
